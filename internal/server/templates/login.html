{{template "layout_start" .}}
<main class="auth-shell">
  <section class="panel auth-panel">
    <h1>配置中心</h1>
    <p>登录后管理自己的项目配置。</p>
    <form id="loginForm" class="form">
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
      <p class="muted">没有账号？<a href="/register">创建账号</a></p>
      <p id="message" class="message"></p>
    </form>
  </section>
</main>
<script>
document.querySelector("#loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target).entries());
  const response = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  if (response.ok) location.href = "/projects";
  else document.querySelector("#message").textContent = "用户名或密码不正确";
});
</script>
{{template "layout_end" .}}
